<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compra confirmada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../design-system/assets/Code/meuquarto.tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- Three states share this page: ?estado=aguardando (spinner, "Confirmando o pagamento"), confirmado (below), cancelado ("Pagamento não concluído. Nada foi cobrado." + Voltar à loja). -->
<div class="page">
  <header class="topbar">
    <div class="wrap topbar__in">
      <a href="landing.html" class="wordmark">meuquarto</a>
      <a href="loja.html" class="mq-btn mq-btn--ghost mq-btn--sm">Voltar à loja</a>
    </div>
  </header>

  <main class="wrap sections">
    <div class="grid" style="padding-top: var(--page-top); align-items: center;">
      <div class="span-all t-span-4 d-span-5" data-theme="locadora" aria-hidden="true" style="position: relative; height: 320px; background: var(--surface-100); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: 6px solid var(--border); overflow: hidden;">
        <img src="covers/c09.svg" alt="" style="position: absolute; left: 12%; top: 48px; width: 34%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 2px; box-shadow: var(--shadow-poster); transform: rotate(-2.2deg);">
        <span class="mq-tape" style="left: 22%; right: auto; top: 40px;"></span>
        <img src="covers/c07.svg" alt="" style="position: absolute; left: 54%; top: 72px; width: 30%; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 2px; box-shadow: var(--shadow-poster); transform: rotate(1.6deg);">
        <span class="mq-pin" style="left: 76%; right: auto; top: 64px;"></span>
        <p class="mq-slip" style="right: 8%; bottom: 36px;">novo tema</p>
      </div>
      <div class="span-all t-span-4 d-span-6 stack" style="gap: var(--l3); grid-column-end: -1;">
        <div class="pair-2">
          <p class="status status--ok" role="status"><svg class="icon" aria-hidden="true"><use href="icons.svg#check"/></svg>Pagamento confirmado via Pix</p>
          <h1 class="t-h1">O tema Locadora é seu</h1>
          <p class="t-lead muted measure-s">Ele já está na sua lista de temas. Aplique agora ou quando quiser, em Perfil.</p>
        </div>
        <div class="actions">
          <a href="painel-perfil.html" class="mq-btn mq-btn--primary">Usar o tema agora</a>
          <a href="compras.html" class="mq-btn mq-btn--secondary">Ver compras</a>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
