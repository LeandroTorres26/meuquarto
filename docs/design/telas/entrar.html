<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar no meuquarto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../design-system/assets/Code/meuquarto.tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="wrap topbar__in" style="max-width: none;">
      <a href="landing.html" class="wordmark">meuquarto</a>
      <a href="cadastro.html" class="mq-btn mq-btn--ghost mq-btn--sm">Crie o seu</a>
    </div>
  </header>

  <div class="auth">
    <aside class="auth__art" aria-hidden="true">
      <p class="t-hand">a parede te esperando</p>
      <ul class="shelf" style="grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 520px;">
        <li><article class="mq-item mq-item--game" style="--tilt-f:0.685"><div class="mq-item__link"><figure class="mq-item__cover"><span class="mq-gamebar"><svg class="mq-icon icon"><use href="icons.svg#gamepad-2"/></svg></span><img class="mq-art" src="covers/c01.svg" alt=""></figure><div class="mq-item__meta"><h3 class="mq-item__title">Celeste</h3><p class="mq-item__sub">2018</p></div></div></article></li>
        <li><article class="mq-item mq-item--book mq-item--volume mq-item--ribbon" style="--tilt-f:-0.804"><div class="mq-item__link"><figure class="mq-item__cover"><span class="mq-ribbon" aria-hidden="true"></span><img class="mq-art" src="covers/c09.svg" alt=""><p class="mq-slip">nonada</p></figure><div class="mq-item__meta"><h3 class="mq-item__title">Grande Sertão</h3><p class="mq-item__sub">1956</p></div></div></article></li>
        <li><article class="mq-item mq-item--poster mq-item--peel mq-item--peel-br" style="--tilt-f:-0.603;--peel-size:15.2%"><div class="mq-item__link"><figure class="mq-item__cover"><img class="mq-art" src="covers/c07.svg" alt=""></figure><div class="mq-item__meta"><h3 class="mq-item__title">Twin Peaks</h3><p class="mq-item__sub">1990</p></div></div></article></li>
      </ul>
    </aside>

    <main class="auth__form wrap wrap--form">
      <div class="groups">
        <h1 class="t-h1">Entrar</h1>
        <div class="alert" role="alert"><svg class="icon" aria-hidden="true"><use href="icons.svg#alert"/></svg><span>E-mail ou senha não conferem. Confira os dois e tente de novo.</span></div>
        <form class="form">
          <div class="field">
            <label class="label" for="email">E-mail</label>
            <input id="email" class="input" type="email" autocomplete="email" value="leandro@email.com">
          </div>
          <div class="field">
            <label class="label" for="senha">Senha</label>
            <input id="senha" class="input input--error" type="password" autocomplete="current-password" value="12345678" aria-invalid="true">
          </div>
          <button type="submit" class="mq-btn mq-btn--primary btn-block">Entrar</button>
        </form>
        <p class="t-sm">Ainda não tem um quarto? <a href="cadastro.html">Crie o seu</a></p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
