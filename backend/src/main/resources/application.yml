spring:
  application:
    name: meuquarto-api
  threads:
    virtual:
      enabled: true
  # Connection comes from the environment (compose sets these); tests use Testcontainers instead.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meuquarto}
    username: ${DB_USER:meuquarto}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema changes only through Flyway
  flyway:
    locations: classpath:db/migration
  # Sessions in PostgreSQL (ADR 0012); tables come from Flyway (V4), never auto-created.
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */30 * * * *"

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Only the health endpoint is exposed, at /api/health, without details.
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
