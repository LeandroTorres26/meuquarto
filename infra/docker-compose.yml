# Local development stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
# Ports bind to 127.0.0.1 only: nothing is reachable from other machines.
name: meuquarto

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mail catcher: receives every e-mail the API sends (password reset) and shows it in a web UI.
  # Nothing is delivered to the outside. Reachable from this machine only; the UI has no login.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI: http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Links in e-mails are built from this origin only (validated at startup). Local default below.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # Outgoing e-mail: Mailpit by default; point these at a transactional provider in production.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-meuquarto <no-reply@meuquarto.local>}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ../frontend
    environment:
      API_URL: http://api:8080
      # false unless a reverse proxy that overwrites X-Forwarded-For (Caddy) is in front (ADR 0017).
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
