<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Figtree:wght@500&display=swap">
<style>
html,body{margin:0;background:var(--surface-100)}
svg{display:block;width:960px;height:288px}
.brand{fill:var(--brand)}.ink{fill:var(--ink)}.accent{fill:var(--accent)}.s3{fill:var(--surface-300)}.s2{fill:var(--surface-200)}.paper{fill:var(--paper)}.tape{fill:var(--tape)}.stk{fill:var(--sticker-anime)}
.poster{rx:var(--radius-sm)}
.groove{fill:none;stroke:var(--border-strong);stroke-width:2}
.name{font:900 84px/1 var(--font-display);letter-spacing:.01em;fill:var(--ink);text-transform:uppercase}
.tag{font:500 14px var(--font-sans);fill:var(--ink-muted)}
</style></head><body>
<svg viewBox="0 0 960 288" role="img" aria-label="meuquarto">
<!-- blocks: brand 144x216 poster, accent 144x192 poster, ink 144x240 slab, surface-300 144x168 slab, paper 96x24 slip (space-6/8 multiples)
     arrangement: four poster-shaped slabs of unequal height on a baseline, bleeding off the bottom, like prints on a wall
     pattern: a literal motif -> a vinyl record built from circles half hidden behind the brand poster, two tape strips on top
     steps/radii: 8,16,24 px; radius-sm corners, circles for the record -->
<circle class="s3" cx="640" cy="152" r="104"/>
<circle class="groove" cx="640" cy="152" r="84"/><circle class="groove" cx="640" cy="152" r="64"/>
<circle class="accent" cx="640" cy="152" r="32"/>
<rect class="brand poster" x="496" y="48" width="144" height="240"/>
<rect class="accent poster" x="664" y="88" width="144" height="200"/>
<rect class="s3 poster" x="816" y="24" width="128" height="264"/>
<rect class="stk poster" x="832" y="168" width="96" height="24"/>
<rect class="tape" x="540" y="38" width="56" height="18"/>
<rect class="tape" x="860" y="14" width="56" height="18"/>
<text class="name" x="32" y="232">meuquarto</text>
<text class="tag" x="32" y="262">Seu gosto, num só lugar.</text>
</svg></body></html>
