<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil não encontrado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../design-system/assets/Code/meuquarto.tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="wrap topbar__in">
      <a href="landing.html" class="wordmark">meuquarto</a>
      <a href="entrar.html" class="mq-btn mq-btn--ghost mq-btn--sm">Entrar</a>
    </div>
  </header>

  <main class="wrap sections">
    <div class="grid" style="padding-top: var(--page-top); align-items: center;">
      <div class="span-all t-span-4 d-span-5" aria-hidden="true" style="position: relative; height: 300px; border-bottom: 6px solid var(--border);">
        <div style="position: absolute; left: 4%; top: 40px; width: 30%; aspect-ratio: 2 / 3; border: 2px dashed var(--border-strong); border-radius: var(--radius-sm); transform: rotate(-2deg);"></div>
        <span class="mq-tape" style="left: 12%; right: auto; top: 30px;"></span>
        <div style="position: absolute; left: 40%; top: 16px; width: 26%; aspect-ratio: 2 / 3; border: 2px dashed var(--border-strong); border-radius: var(--radius-sm); transform: rotate(1.4deg);"></div>
        <span class="mq-pin" style="left: 58%; right: auto; top: 8px;"></span>
        <div style="position: absolute; left: 70%; top: 150px; width: 26%; aspect-ratio: 1 / 1; border: 2px dashed var(--border-strong); border-radius: var(--radius-sm); transform: rotate(-1.2deg);"></div>
        <p class="mq-slip" style="left: 6%; right: auto; bottom: 40px;">volto já</p>
      </div>
      <div class="span-all t-span-4 d-span-6 stack" style="gap: var(--l3); grid-column-end: -1;">
        <div class="pair-2">
          <h1 class="t-h1">Ninguém mora aqui ainda</h1>
          <p class="t-lead muted measure-s">Não existe perfil em meuquarto.com.br/fulano. Pode ser que o endereço tenha mudado, ou que ele esteja livre para você.</p>
        </div>
        <div class="actions">
          <a href="cadastro.html" class="mq-btn mq-btn--primary">Usar esse endereço</a>
          <a href="landing.html" class="mq-btn mq-btn--secondary">Ir para o início</a>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
