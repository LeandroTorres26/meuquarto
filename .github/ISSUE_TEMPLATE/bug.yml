name: Bug
description: Something does not work as specified
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Reference the requirement, rule or screen if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Environment (local, production), browser/device, URL.
