<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O quarto de Leandro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../design-system/assets/Code/meuquarto.tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- Protótipo em CSS 3D. Tecnologia final a decidir; manter o mesmo conteúdo, a mesma câmera e os mesmos controles.
     Prototype URL params (not in the app): ?modo=toque|mouse forces an input model, ?objeto=<grupo> starts selected,
     ?hover=<grupo> fakes a hover, ?dica=1 replays the first-visit hint. Groups: parede, mural, estante, vitrola, tv. -->
<div class="page room" id="room">
  <div class="room-stage" id="stage" aria-label="Quarto em 3D">
    <div class="room-anchor" id="anchor"><div class="room-world" id="world"></div></div>
    <div class="room-anchor room-anchor--flat" id="anchor2"><div id="pins"></div></div>
  </div>
  <p class="room-hint" id="hint" role="status" hidden>Toque em um objeto ou use os atalhos abaixo. Arraste para girar, use dois dedos para mover e aproximar.</p>

  <div class="room-bar">
    <a href="perfil.html" class="mq-btn mq-btn--secondary mq-btn--sm"><svg class="icon" aria-hidden="true"><use href="icons.svg#arrow-left"/></svg>Voltar ao perfil</a>
    <button type="button" class="mq-btn mq-btn--secondary mq-btn--sm mq-btn--icon" aria-label="Compartilhar o quarto"><svg class="icon" aria-hidden="true"><use href="icons.svg#share-2"/></svg></button>
  </div>

  <div class="room-tools" role="toolbar" aria-label="Câmera e luz">
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Girar para a esquerda" data-act="rotL"><svg class="icon" aria-hidden="true"><use href="icons.svg#rotate-ccw"/></svg></button>
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Girar para a direita" data-act="rotR"><svg class="icon" aria-hidden="true"><use href="icons.svg#rotate-cw"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Aproximar" data-act="in"><svg class="icon" aria-hidden="true"><use href="icons.svg#zoom-in"/></svg></button>
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Afastar" data-act="out"><svg class="icon" aria-hidden="true"><use href="icons.svg#zoom-out"/></svg></button>
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Centralizar o quarto" data-act="center"><svg class="icon" aria-hidden="true"><use href="icons.svg#scan"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="mq-btn mq-btn--icon" aria-label="Abajur" aria-pressed="true" data-act="lamp" id="lamp"><svg class="icon" aria-hidden="true"><use href="icons.svg#lightbulb"/></svg></button>
  </div>

  <button type="button" class="mq-btn mq-btn--secondary mq-btn--sm room-expand" id="expand" data-act="expand" aria-controls="sheet" aria-expanded="false" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#panel-right-open"/></svg><span>Mostrar painel</span></button>
  <section class="room-info" id="sheet" aria-labelledby="room-h">
    <button type="button" class="ib room-collapse" id="collapse" data-act="collapse" aria-controls="sheet" aria-expanded="true" aria-label="Recolher painel"><svg class="icon" aria-hidden="true"><use href="icons.svg#panel-right-close"/></svg></button>
    <div class="room-grab" aria-hidden="true"></div>
    <div class="room-head">
      <h1 id="room-h" class="t-h2">O quarto de Leandro</h1>
    </div>
    <div aria-live="polite" class="stack" id="detail"></div>
    <div class="chips room-chips" role="group" aria-label="Objetos do quarto" id="chips"></div>
    <a href="cadastro.html" class="mq-btn mq-btn--primary self-start room-cta">Crie o seu quarto</a>
  </section>
</div>

<script src="item.js"></script>

    Object.assign(tgt, o);
    tgt.zoom = clamp(tgt.zoom, LIM.zoom); tgt.yaw = clamp(tgt.yaw, LIM.yaw); clampPan(tgt);
    if (reduce.matches) { Object.assign(cam, tgt); applyCamera(); } else if (!raf) raf = requestAnimationFrame(step);
  }
  /* touch: pan and zoom so the selected object sits in the visible area above the sheet */
  function frameObject(k) {
    requestAnimationFrame(function () {
      relayout();
      var z = 1.6, s = tgt.fs * z, p = project(groups[k].at, s, { yaw: tgt.yaw, pitch: tgt.pitch });
      var ox = tgt.cx - s * BOX.cx, oy = tgt.cy - s * BOX.cy;
      var side = room.classList.contains('room--side'), sh = sheet.getBoundingClientRect(), tl = document.querySelector('.room-tools').getBoundingClientRect();
      var top = (side ? 72 : tl.bottom + 8), bottom = (side ? tl.top : sh.top) - 12, midX = side ? (sh.left - 8) / 2 : innerWidth / 2;
      moveTo({ zoom: z, px: midX - (ox + p.x), py: top + (bottom - top) * 0.25 - (oy + p.y) });
    });
  }
  function homeCamera() { moveTo({ zoom: 1, px: 0, py: 0 }); }

  /* ---------- selection, hover, focus ---------- */
  var last = null, pushed = false;
  function itemId() { return new URLSearchParams(location.search).get('item'); }
  function groupOf(id) { return keys.filter(function (k) { return groups[k].items.indexOf(id) >= 0; })[0] || null; }

  function applyLit() {
    var lit = {}; [st.sel, st.hover, st.focus].forEach(function (k) { if (k) lit[k] = true; });
    world.querySelectorAll('.bx[data-g]').forEach(function (b) { b.classList.toggle('is-lit', !!lit[b.getAttribute('data-g')]); });
    pins.querySelectorAll('.room-pin').forEach(function (b) {
      var k = b.getAttribute('data-k');
      b.classList.toggle('is-shown', !!lit[k] || st.hint);
      b.setAttribute('aria-pressed', String(st.sel === k));
    });
    room.classList.toggle('has-sel', !!st.sel);
  }
  function renderPanel() {
    $('chips').innerHTML = keys.map(function (k) { return '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + (st.sel === k) + '">' + groups[k].label + '</button>'; }).join('');
    var g = st.sel && groups[st.sel], id = itemId();
    $('detail').innerHTML = !g ? '' : id
      ? '<button type="button" class="mq-btn mq-btn--ghost mq-btn--sm self-start" data-back><svg class="icon" aria-hidden="true"><use href="icons.svg#arrow-left"/></svg>' + g.label + '</button><div class="detail-wrap">' + MQItem.render(id, { hid: 'room-item-h', back: 'Voltar para ' + g.label }) + '</div>'
      : '<div class="pair-2"><h2 class="t-h3">' + g.title + '</h2><p class="t-sm">' + g.sub + '</p></div><ul class="list">' + g.items.map(function (i) { var it = MQItem.get(i); return '<li><button type="button" class="room-item" data-item="' + i + '"><img class="thumb' + (it.cat === 'music' ? ' thumb--sq' : '') + '" src="' + it.cover + '" alt=""><span class="grow pair"><span class="t-poster">' + it.title.replace(/&/g, '&amp;') + '</span><span class="t-cap">' + it.year + '</span></span></button></li>'; }).join('') + '</ul>';
    $('lamp').setAttribute('aria-pressed', String(st.lamp));
    sheetSize();
  }
  function select(k) {
    if (itemId()) history.replaceState(null, '', location.pathname);
    pushed = false; st.sel = k; if (st.collapsed) setCollapsed(false); renderPanel(); applyLit();
    if (st.touch) frameObject(k);
  }
  function clearSel() {
    if (!st.sel) return;
    st.sel = null;
    if (itemId()) history.replaceState(null, '', location.pathname);
    renderPanel(); applyLit(); homeCamera();
  }
  /* collapse: the panel becomes one small button; focus moves to the control that remains */
  function setCollapsed(v, moveFocus) {
    st.collapsed = v;
    room.classList.toggle('is-collapsed', v);
    var ex = $('expand'), co = $('collapse'), side = room.classList.contains('room--side');
    ex.hidden = !v; ex.setAttribute('aria-expanded', 'false'); co.setAttribute('aria-expanded', 'true');
    ex.querySelector('use').setAttribute('href', 'icons.svg#' + (side ? 'panel-right-open' : 'chevron-up'));
    co.querySelector('use').setAttribute('href', 'icons.svg#' + (side ? 'panel-right-close' : 'chevron-down'));
    ex.querySelector('span').textContent = st.touch ? 'Atalhos' : 'Mostrar painel';
    co.setAttribute('aria-label', st.touch ? 'Recolher atalhos' : 'Recolher painel');
    try { localStorage.setItem('mq-quarto-painel', v ? 'recolhido' : 'aberto'); } catch (_) {}
    /* closing the panel also closes what it was showing: the selection and its label go away */
    if (v) { st.hint = false; clearSel(); applyLit(); }
    relayout();
    if (moveFocus) (v ? ex : co).focus();
  }
  function setHover(k) { if (st.hover !== k) { st.hover = k; applyLit(); } }

  /* ---------- input model ---------- */
  function setMode() {
    var m = q.get('modo');
    st.touch = m === 'toque' || (m !== 'mouse' && noHover.matches);
    room.classList.toggle('room--touch', st.touch);
    /* the how-to is not in the panel: it describes the scene for screen readers (and, on touch, shows in the first-visit hint) */
    stage.setAttribute('aria-label', st.touch
      ? 'Quarto em 3D. Arraste para girar, use dois dedos para mover e aproximar. Toque num objeto ou num atalho abaixo.'
      : 'Quarto em 3D. Arraste para girar e inclinar; para mover, arraste com o botão direito ou com Espaço apertado; a roda aproxima. Clique num objeto para ver o que tem ali.');
    applyCamera();
  }
  function sheetSize() { room.style.setProperty('--sheet-h', room.classList.contains('room--side') || st.collapsed ? '0px' : (room.getBoundingClientRect().bottom - sheet.getBoundingClientRect().top) + 'px'); }

  /* ---------- pointer: drag rotates (and tilts with a mouse), pinch zooms, a tap selects ---------- */
  var ptrs = {}, drag = null, pinch = null, spaceDown = false;
  function centroid() { var p = Object.keys(ptrs).map(function (k) { return ptrs[k]; }); return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; }
  /* Space held over the room turns a left drag into a pan, like in Figma */
  addEventListener('keydown', function (e) { if (e.code === 'Space' && !(e.target.closest && e.target.closest('button, a, input, textarea')) && !st.touch) { spaceDown = true; room.classList.add('is-pan-ready'); e.preventDefault(); } });
  addEventListener('keyup', function (e) { if (e.code === 'Space') { spaceDown = false; room.classList.remove('is-pan-ready'); } });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });   /* no native image drag out of the scene */
  function groupAt(x, y) {
    var el = document.elementFromPoint(x, y), b = el && el.closest('.bx[data-g], .room-pin');
    return b ? (b.getAttribute('data-g') || b.getAttribute('data-k')) : null;
  }
  function dist() { var p = Object.keys(ptrs).map(function (k) { return ptrs[k]; }); return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var n = Object.keys(ptrs).length;
    /* right or middle button, or Space / Shift with the left one: pan; otherwise rotate (and tilt) */
    var pan = e.pointerType === 'mouse' && (e.button === 1 || e.button === 2 || spaceDown || e.shiftKey);
    if (n === 1) { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, raw: rawPitch, px: cam.px, py: cam.py, pan: pan, moved: false }; if (pan) { e.preventDefault(); room.classList.add('is-panning'); } }
    /* two fingers: pinch zooms and moving them together pans */
    if (n === 2) { var c0 = centroid(); pinch = { d: dist(), zoom: tgt.zoom, x: c0.x, y: c0.y, px: tgt.px, py: tgt.py }; drag = null; }
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!ptrs[e.pointerId]) { if (e.pointerType === 'mouse' && !st.touch) setHover(groupAt(e.clientX, e.clientY)); return; }
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch && Object.keys(ptrs).length === 2) { var c1 = centroid(); moveTo({ zoom: pinch.zoom * dist() / pinch.d, px: pinch.px + c1.x - pinch.x, py: pinch.py + c1.y - pinch.y }); return; }
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
    if (drag.pan) { var o = clampPan({ px: drag.px + dx, py: drag.py + dy }); cam.px = tgt.px = o.px; cam.py = tgt.py = o.py; applyCamera(); return; }
    cam.yaw = tgt.yaw = clamp(drag.yaw + dx * 0.35, LIM.yaw);
    if (!st.touch) { rawPitch = drag.raw + dy * 0.12; cam.pitch = tgt.pitch = softPitch(rawPitch); }   /* no tilt on touch: vertical drag belongs to the sheet */
    applyCamera();
  });
  function up(e) {
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    room.classList.remove('is-panning');
    if (drag && !drag.moved && !drag.pan && e.type === 'pointerup') {
      var k = groupAt(e.clientX, e.clientY);
      if (k) select(k); else if (st.touch) clearSel();
    }
    if (drag && !drag.pan) rawPitch = PITCH0 + PITCH_R * Math.atanh(Math.max(-0.999, Math.min(0.999, (cam.pitch - PITCH0) / PITCH_R)));   /* next drag starts where the tilt eased to */
    if (!Object.keys(ptrs).length) { drag = null; pinch = null; }
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !ptrs[e.pointerId]) setHover(null); });
  /* wheel and trackpad pinch (ctrlKey) zoom only over the scene, and the page never scrolls */
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.shiftKey) { moveTo({ px: tgt.px - (e.deltaX || e.deltaY), py: tgt.py }); return; }   /* Shift + wheel pans sideways */
    moveTo({ zoom: tgt.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)) });
  }, { passive: false });

  /* labels are buttons: Tab reaches each object, and focus shows label and glow like hover */
  pins.addEventListener('focusin', function (e) { var b = e.target.closest('[data-k]'); if (b) { st.focus = b.getAttribute('data-k'); applyLit(); } });
  pins.addEventListener('focusout', function () { st.focus = null; applyLit(); });

  /* touch sheet: dragging the handle or the title down clears the selection */
  var sdrag = null;
  sheet.addEventListener('pointerdown', function (e) {
    if (!st.touch || !st.sel || !e.target.closest('.room-grab, .room-head')) return;
    sdrag = { y: e.clientY, dy: 0 }; sheet.classList.add('is-dragging'); sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', function (e) { if (!sdrag) return; sdrag.dy = Math.max(0, e.clientY - sdrag.y); sheet.style.translate = '0 ' + sdrag.dy + 'px'; });
  function sheetUp() { if (!sdrag) return; sheet.classList.remove('is-dragging'); sheet.style.translate = ''; if (sdrag.dy > 72) clearSel(); sdrag = null; }
  sheet.addEventListener('pointerup', sheetUp); sheet.addEventListener('pointercancel', sheetUp);

  /* ---------- clicks: pins, chips, tools, items (S17 in the panel) ---------- */
  function closeItem() { if (pushed) { history.back(); return; } history.replaceState(null, '', location.pathname); renderPanel(); }
  addEventListener('popstate', function (e) {
    pushed = !!(e.state && e.state.item); var g = groupOf(itemId()); if (g) st.sel = g; renderPanel(); applyLit();
    var b = !itemId() && last && document.querySelector('[data-item="' + last + '"]'); if (b) b.focus();
  });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (itemId()) closeItem(); else if (st.sel && st.touch) clearSel(); } });
  document.addEventListener('click', function (e) {
    var it = e.target.closest('[data-item]');
    if (it) { history.pushState({ item: true }, '', '?item=' + it.getAttribute('data-item')); pushed = true; last = it.getAttribute('data-item'); renderPanel(); var h = $('room-item-h'); h.tabIndex = -1; h.focus(); return; }
    if (e.target.closest('[data-back], [data-close]')) { closeItem(); return; }
    var k = e.target.closest('[data-k]'); if (k) { select(k.getAttribute('data-k')); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'rotL') moveTo({ yaw: tgt.yaw + 15 });
    if (act === 'rotR') moveTo({ yaw: tgt.yaw - 15 });
    if (act === 'in') moveTo({ zoom: tgt.zoom * 1.25 });
    if (act === 'out') moveTo({ zoom: tgt.zoom / 1.25 });
    if (act === 'collapse') { setCollapsed(true, true); return; }
    if (act === 'expand') { setCollapsed(false, true); return; }
    if (act === 'center') moveTo({ zoom: 1, px: 0, py: 0, yaw: -45, pitch: PITCH0 });
    if (act === 'lamp') { st.lamp = !st.lamp; buildWorld(); renderPanel(); }
  });

  /* first touch visit: every label for ~2s with the hint, then they fade and never return */
  function firstHint() {
    var seen = false;
    try { seen = localStorage.getItem('mq-quarto-dica') === '1'; } catch (_) {}
    var force = /^(1|fixa)$/.test(q.get('dica') || '');
    if (!st.touch || q.get('dica') === '0' || (seen && !force)) return;
    var hint = $('hint'); hint.hidden = false; st.hint = true; applyLit();
    setTimeout(function () {
      st.hint = false; applyLit(); hint.classList.add('is-gone');
      setTimeout(function () { hint.hidden = true; }, 450);
      try { localStorage.setItem('mq-quarto-dica', '1'); } catch (_) {}
    }, q.get('dica') === 'fixa' ? 1e9 : 2000);
  }

  buildPins(); setMode(); buildWorld(); renderPanel();
  var start = groupOf(itemId()) || (groups[q.get('objeto')] ? q.get('objeto') : null);
  if (start) select(start);
  relayout(true); setCollapsed(st.collapsed); relayout(true); firstHint();
  noHover.addEventListener('change', function () { setMode(); renderPanel(); relayout(); });
  addEventListener('resize', function () { relayout(true); });
  /* the panel changes height with the selection: the room eases into the new free area */
  new ResizeObserver(function () { relayout(); }).observe(sheet);
})();
</script>
</body>
</html>
