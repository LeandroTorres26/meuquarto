<!doctype html>
<html lang="pt-BR" data-theme="noite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destaques e coleção, painel do meuquarto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../design-system/assets/Code/meuquarto.tokens.css">
<link rel="stylesheet" href="../../design-system/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- S7 Destaques. Per category: the highlights strip (ordered, limit 4 free / 12 with the pack) above the whole collection
     (no limit; sync + manual). Prototype params: ?aba=favoritos|filmes|series|animes|mangas|livros|musica|games, ?pack=1 (limit 12).
     Everything on the page works: highlight, remove, reorder, note, hide/remove, search, sort. -->
<div class="page">
  <header class="topbar">
    <div class="wrap topbar__in">
      <a href="landing.html" class="wordmark">meuquarto</a>
      <a href="perfil.html" class="mq-btn mq-btn--ghost mq-btn--sm">Ver meu perfil</a>
    </div>
  </header>
  <div class="wrap pshell">
    <nav class="pnav" aria-label="Painel">
      <div class="pnav__group"><a class="tab" href="painel-perfil.html">Perfil</a><a class="tab" href="painel-destaques.html" aria-current="page">Destaques</a><a class="tab" href="painel-agora.html">Agora</a><a class="tab" href="painel-contas.html">Contas vinculadas</a></div>
      <div class="pnav__group"><a class="tab" href="loja.html">Loja</a><a class="tab" href="compras.html">Compras</a><a class="tab" href="conta.html">Conta</a></div>
    </nav>

    <main class="pmain">
      <div class="page-head">
        <h1 class="t-h1">Destaques</h1>
        <p class="t-body muted measure">Sua coleção guarda tudo, sem limite. Os destaques são o que você escolhe dela para a parede do perfil.</p>
      </div>
      <div class="chips" role="tablist" aria-label="Categoria" id="tabs"></div>

      <section class="stack next" aria-labelledby="hl-h" id="hl"></section>
      <section class="stack next" aria-labelledby="coll-h" id="coll"></section>
    </main>
  </div>
  <div class="mq-toasts" id="toasts" aria-live="polite"></div>
</div>
<script src="item.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var LIMIT = q.get('pack') === '1' ? 12 : 4;
  var $ = function (id) { return document.getElementById(id); };
  var icon = function (n) { return '<svg class="icon" aria-hidden="true"><use href="icons.svg#' + n + '"/></svg>'; };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
  var norm = function (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var CATL = { movie: 'Filme', series: 'Série', anime: 'Anime', manga: 'Mangá', book: 'Livro', game: 'Game', music: 'Música' };

  /* tabs: Favoritos de tudo (cross-category) + one per category */
  var TABS = [{ slug: 'favoritos', label: 'Favoritos de tudo', unit: ['item', 'itens'], hl: MQItem.favorites.slice(), all: true }].concat(MQItem.cats.map(function (c) {
    return { slug: c.slug, label: c.label, unit: c.unit, hl: c.hl.slice(), cat: c.cat };
  }));
  var coll = {}, notes = {}, gone = {};
  TABS.forEach(function (t) { coll[t.slug] = t.all ? [].concat.apply([], MQItem.cats.map(function (c) { return MQItem.collection(c.slug); })) : MQItem.collection(t.slug); });
  var st = { tab: (TABS.filter(function (t) { return t.slug === q.get('aba'); })[0] || TABS[1]).slug, q: '', ordem: 'recentes', menu: null };
  var tab = function () { return TABS.filter(function (t) { return t.slug === st.tab; })[0]; };
  var note = function (id) { return id in notes ? notes[id] : MQItem.get(id).note; };

  function meter(n) {
    var bar = ''; for (var i = 0; i < LIMIT; i++) bar += '<span' + (i < n ? '' : ' class="is-free"') + '></span>';
    return '<p class="mq-slots"><span class="mq-slots__bar" aria-hidden="true">' + bar + '</span>' + n + ' de ' + LIMIT + '</p>';
  }
  function slotCard(id) {
    var it = MQItem.get(id);
    return MQItem.card(id, { tag: tab().all }).replace(/<a class="mq-item__link"[^>]*>/, '<div class="mq-item__link">').replace('</a></article>', '</div></article>');
  }
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button type="button" role="tab" class="chip" data-tab="' + t.slug + '" aria-selected="' + (t.slug === st.tab) + '">' + t.label + ' <span class="count">' + t.hl.length + '/' + LIMIT + '</span></button>';
    }).join('');
  }
  function renderHl() {
    var t = tab(), n = t.hl.length, full = n >= LIMIT;
    var slots = t.hl.map(function (id, i) {
      var name = esc(MQItem.get(id).title);
      return '<li class="hl-slot">' + slotCard(id) + '<div class="hl-ctrl">' +
        '<button type="button" class="ib" data-move="' + id + '" data-dir="-1" aria-label="Mover ' + name + ' para antes"' + (i === 0 ? ' disabled' : '') + '>' + icon('chevron-left') + '</button>' +
        '<button type="button" class="ib" data-move="' + id + '" data-dir="1" aria-label="Mover ' + name + ' para depois"' + (i === n - 1 ? ' disabled' : '') + '>' + icon('chevron-right') + '</button>' +
        '<button type="button" class="ib ib--danger" data-unhl="' + id + '" aria-label="Remover ' + name + ' dos destaques">' + icon('x') + '</button></div></li>';
    }).join('');
    var free = full ? '' : '<li class="hl-slot"><a class="mq-slot hl-empty" href="#coll-h">' + icon('plus') + '<span>Destaque um item da coleção</span></a></li>';
    $('hl').innerHTML =
      '<div class="hl-head"><div class="pair-2"><h2 id="hl-h" class="t-h2">Destaques' + (t.all ? '' : ' de ' + t.label) + '</h2><p class="help">Na ordem da parede. Use as setas para mudar a ordem.</p></div>' + meter(n) + '</div>' +
      (full && LIMIT < 12 ? '<div class="mq-upsell"><p class="mq-upsell__text" id="hl-full"><strong>' + t.label + ' está cheio</strong>No plano grátis cabem 4 destaques. Com o pack de destaques, cabem 12. A coleção continua sem limite.</p><div class="mq-upsell__side"><a class="mq-btn mq-btn--primary" href="loja.html">Ver o pack</a></div></div>' : '') +
      (full && LIMIT >= 12 ? '<p class="help" id="hl-full">Os 12 destaques estão ocupados. Remova um para destacar outro.</p>' : '') +
      (n ? '<ol class="hl-strip' + (LIMIT > 4 ? ' hl-strip--pack' : '') + '" aria-label="Destaques, na ordem da parede">' + slots + free + '</ol>' : '<div class="cat-empty"><p class="t-sm">Nenhum destaque ainda. O perfil mostra os destaques; escolha na coleção abaixo.</p></div>');
  }
  function list() {
    var t = tab();
    var l = coll[t.slug].filter(function (id) { return !gone[id] && (!st.q || norm(MQItem.get(id).title).indexOf(norm(st.q)) >= 0); });
    if (st.ordem === 'titulo') l.sort(function (a, b) { return MQItem.get(a).title.localeCompare(MQItem.get(b).title, 'pt'); });
    if (st.ordem === 'ano') l.sort(function (a, b) { return MQItem.get(b).year - MQItem.get(a).year; });
    return l;
  }
  function renderColl(keepFocus) {
    var t = tab(), full = t.hl.length >= LIMIT, l = list(), total = coll[t.slug].filter(function (id) { return !gone[id]; }).length;
    var rows = l.map(function (id) {
      var it = MQItem.get(id), hl = t.hl.indexOf(id) >= 0, synced = !!it.origin, name = esc(it.title);
      var src = synced ? MQItem.platform(it.cat)[0] : 'Manual';
      var act = hl
        ? '<button type="button" class="mq-btn mq-btn--ghost mq-btn--sm" data-unhl="' + id + '">Remover dos destaques</button>'
        : '<button type="button" class="mq-btn mq-btn--secondary mq-btn--sm" data-hl="' + id + '"' + (full ? ' disabled aria-describedby="hl-full"' : '') + '>' + icon('star') + 'Destacar</button>';
      var menu = '<div class="menu"><button type="button" class="ib" data-menu="' + id + '" aria-haspopup="menu" aria-expanded="' + (st.menu === id) + '" aria-label="Mais ações para ' + name + '">' + icon('ellipsis') + '</button>' +
        (st.menu === id ? '<div class="menu__pop" role="menu">' + (synced
          ? '<button type="button" role="menuitem" data-hide="' + id + '">' + icon('eye-off') + 'Ocultar da coleção</button>'
          : '<button type="button" role="menuitem" class="is-danger" data-remove="' + id + '">' + icon('trash') + 'Remover da coleção</button>') + '</div>' : '') + '</div>';
      return '<li class="coll-row"><img class="thumb' + (it.cat === 'music' ? ' thumb--sq' : '') + '" src="' + it.cover + '" alt="">' +
        '<div class="meta"><p class="t-poster">' + name + '</p><p class="line"><span class="t-cap">' + (t.all ? CATL[it.cat] + ', ' : '') + it.year + '</span><span class="src-badge' + (synced ? '' : ' src-badge--manual') + '">' + src + '</span>' + (hl ? '<span class="hl-seal hl-seal--row">' + icon('star') + 'Destaque</span>' : '') + '</p></div>' +
        '<div class="note"><label class="sr" for="n-' + id + '">Nota para ' + name + '</label><input id="n-' + id + '" class="input input--sm" data-note="' + id + '" value="' + esc(note(id)) + '" placeholder="Adicionar nota (opcional)"></div>' +
        '<div class="acts">' + act + menu + '</div></li>';
    }).join('');
    $('coll').innerHTML =
      '<div class="hl-head"><div class="pair-2"><h2 id="coll-h" class="t-h2" tabindex="-1">Coleção' + (t.all ? '' : ' de ' + t.label) + '</h2><p class="help">' + total + ' ' + t.unit[total === 1 ? 0 : 1] + '. ' + (t.all ? 'Tudo o que está na sua coleção, de todas as categorias.' : 'O que vem das contas vinculadas e o que você adicionou à mão.') + '</p></div>' +
      '<a class="mq-btn mq-btn--secondary mq-btn--sm" href="busca.html">' + icon('plus') + 'Adicionar obra</a></div>' +
      '<div class="cat-tools"><div class="search"><label for="cq" class="sr">Buscar na coleção</label>' + icon('search') + '<input id="cq" class="input" type="search" placeholder="Buscar na coleção" value="' + esc(st.q) + '" autocomplete="off"></div>' +
      '<fieldset class="seg" id="ordem"><legend class="sr">Ordenar por</legend>' + [['recentes', 'Recentes'], ['titulo', 'Título'], ['ano', 'Ano']].map(function (o) { return '<label><input type="radio" name="ordem" value="' + o[0] + '"' + (st.ordem === o[0] ? ' checked' : '') + '>' + o[1] + '</label>'; }).join('') + '</fieldset></div>' +
      (full ? '<p class="help">' + icon('star') + ' Destaques cheios: para destacar outro, remova um da faixa acima' + (LIMIT < 12 ? ' ou veja o pack' : '') + '. Adicionar à coleção continua livre.</p>' : '') +
      (l.length ? '<ul class="coll-list" aria-label="Coleção">' + rows + '</ul>' : '<div class="cat-empty"><p class="t-sm">' + (st.q ? 'Nada com “' + esc(st.q) + '” na coleção.' : 'A coleção está vazia. Adicione uma obra ou vincule uma conta.') + '</p></div>');
    if (keepFocus) { var i = $('cq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
  function renderAll() { renderTabs(); renderHl(); renderColl(); }
  function toast(html, undo) {
    var el = document.createElement('div');
    el.className = 'mq-toast'; el.setAttribute('role', 'status');
    el.innerHTML = '<p class="mq-toast__text">' + html + '</p>' + (undo ? '<button type="button" class="mq-btn mq-btn--ghost mq-btn--sm" data-undo>Desfazer</button>' : '');
    if (undo) el.querySelector('[data-undo]').onclick = function () { undo(); el.remove(); };
    $('toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, 6000);
  }
  function refocus(sel) { var el = document.querySelector(sel); if (el && !el.disabled) el.focus(); else $('hl-h').setAttribute('tabindex', '-1'), $('hl-h').focus(); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button, a'); if (!b) { if (st.menu) { st.menu = null; renderColl(); } return; }
    var t = tab(), d = b.dataset;
    if (d.tab) { st.tab = d.tab; st.q = ''; st.menu = null; history.replaceState(null, '', '?aba=' + d.tab + (LIMIT > 4 ? '&pack=1' : '')); renderAll(); return; }
    if (d.hl) { if (t.hl.length < LIMIT) { t.hl.push(d.hl); renderAll(); toast('<strong>' + esc(MQItem.get(d.hl).title) + '</strong> está nos destaques.'); refocus('[data-unhl="' + d.hl + '"].mq-btn'); } return; }
    if (d.unhl) { var i = t.hl.indexOf(d.unhl), id = d.unhl; t.hl.splice(i, 1); renderAll(); toast('<strong>' + esc(MQItem.get(id).title) + '</strong> saiu dos destaques. Continua na coleção.', function () { t.hl.splice(i, 0, id); renderAll(); }); refocus('[data-hl="' + id + '"]'); return; }
    if (d.move) { var j = t.hl.indexOf(d.move), k = j + Number(d.dir); t.hl.splice(j, 1); t.hl.splice(k, 0, d.move); renderAll(); refocus('[data-move="' + d.move + '"][data-dir="' + d.dir + '"]'); return; }
    if (d.menu) { st.menu = st.menu === d.menu ? null : d.menu; renderColl(); var m = document.querySelector('.menu__pop button'); if (m) m.focus(); return; }
    if (d.hide || d.remove) {
      var id2 = d.hide || d.remove, wasHl = t.hl.indexOf(id2), name = esc(MQItem.get(id2).title);
      gone[id2] = true; if (wasHl >= 0) t.hl.splice(wasHl, 1); st.menu = null; renderAll();
      toast(d.hide ? '<strong>' + name + '</strong> foi ocultado. Ele não volta na próxima sincronização.' : '<strong>' + name + '</strong> saiu da coleção.', function () { delete gone[id2]; if (wasHl >= 0) t.hl.splice(wasHl, 0, id2); renderAll(); });
      $('coll-h').focus(); return;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.menu) { var id = st.menu; st.menu = null; renderColl(); var b = document.querySelector('[data-menu="' + id + '"]'); if (b) b.focus(); } });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'cq') { st.q = e.target.value; renderColl(true); }
    if (e.target.dataset.note) notes[e.target.dataset.note] = e.target.value;
  });
  document.addEventListener('change', function (e) { if (e.target.name === 'ordem') { st.ordem = e.target.value; renderColl(); document.querySelector('#ordem input[value="' + st.ordem + '"]').focus(); } });
  renderAll();
})();
</script>
</body>
</html>
